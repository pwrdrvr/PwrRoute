packages:
  - apps/*
  - packages/*

# Ignore machine-local hooks so every install hashes the same inputs.
globalPnpmfile: null

# Dependencies that need their build scripts to run during install.
allowBuilds:
  # electron is absent on purpose: since Electron 42 the package has no install
  # script, and the desktop postinstall (install:electron-binary) downloads
  # the binary instead.
  electron-winstaller: true
  esbuild: true

# Supply-chain cooldown: refuse to resolve any npm release younger than seven
# days (10080 minutes), so a compromised publish has a week to be caught and
# unpublished before it can reach a PwrRoute build. Matches PwrGit, PwrAgnt and
# PwrSnap, and the Dependabot cooldown in .github/dependabot.yml.
#
# This has to live here rather than in a developer's own pnpm config:
# `pnpm install --frozen-lockfile` skips resolution, so a machine-local setting
# is a policy no CI job enforces.
minimumReleaseAge: 10080
