version: 2
updates:
  - package-ecosystem: "cargo"
    # One workspace, one Cargo.lock.
    directory: "/"
    schedule:
      interval: "weekly"
    # A version has to be a week old before it is proposed: the same
    # supply-chain window the pnpm workspace enforced before the Rust port.
    cooldown:
      default-days: 7
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      # GPUI and its kit move together; a split bump does not build.
      gpui:
        patterns:
          - "gpui*"
      # The config engine's JS stack: one bump, one compatibility test run.
      js-engine:
        patterns:
          - "rquickjs*"
          - "oxc*"
    ignore:
      # gpui-kit is pinned with `=`; it is upgraded on purpose, with a look at
      # the window, not by a bot.
      - dependency-name: "gpui-kit"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
