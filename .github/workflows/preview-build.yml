name: Preview Build (macOS universal + arm64 DMGs + Windows installer)

on:
  pull_request:
    # `labeled`     — first time the build-preview label is applied.
    # `synchronize` — subsequent pushes to an already-labeled PR; without this,
    #                 the only way to re-run after a fix is to remove and
    #                 re-add the label.
    types: [labeled, synchronize]
  # Not in PwrGit. Lets a maintainer exercise packaging from a branch without
  # opening a PR, which is the only way to run it while main has no PRs yet.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    # Run when the just-applied label is build-preview (labeled event), OR when
    # build-preview is already on the PR (synchronize event), OR on dispatch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        timeout-minutes: 10
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      - name: Compute preview version
        id: version
        env:
          PREVIEW_SUFFIX: ${{ github.event.pull_request.number && format('pr.{0}', github.event.pull_request.number) || format('dev.{0}', github.run_number) }}
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base="${raw%%-*}"
          preview="${base}-${PREVIEW_SUFFIX}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.PREVIEW_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # No signing secrets here on purpose: previews are ad hoc signed and not
      # notarized (scripts/package.mjs decides from the environment).
      - name: Build preview package (unsigned)
        run: pnpm --filter @pwrroute/desktop package:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrRoute-${{ steps.version.outputs.version }}-preview
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  preview-windows:
    name: Build preview installer (Windows)
    # Same gate as the macOS preview above. Keeps the Windows pack off every
    # PR/push.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      # Same action as the macOS preview above; it runs natively on Windows.
      # No cache-priming gate job here (unlike ci.yml): this is a label-gated
      # one-off build, so there is no fan-out to prime for.
      - name: Install Node.js and dependencies
        timeout-minutes: 10
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      # windows-latest defaults to pwsh; force bash for the version-stamp steps
      # so they stay identical to the macOS preview job above.
      - name: Compute preview version
        id: version
        shell: bash
        env:
          PREVIEW_SUFFIX: ${{ github.event.pull_request.number && format('pr.{0}', github.event.pull_request.number) || format('dev.{0}', github.run_number) }}
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base="${raw%%-*}"
          preview="${base}-${PREVIEW_SUFFIX}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        shell: bash
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.PREVIEW_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build preview installer (unsigned)
        run: pnpm --filter @pwrroute/desktop package:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrRoute-${{ steps.version.outputs.version }}-windows-installer
          path: |
            apps/desktop/dist/*-setup.exe
            apps/desktop/dist/*-setup.exe.blockmap
          if-no-files-found: error
          retention-days: 14
