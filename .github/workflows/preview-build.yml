name: Preview Build (macOS universal + Windows x64)

on:
  pull_request:
    # `labeled`     — first time the build-preview label is applied.
    # `synchronize` — subsequent pushes to an already-labeled PR; without this,
    #                 the only way to re-run after a fix is to remove and
    #                 re-add the label.
    types: [labeled, synchronize]
  # Not in PwrGit. Lets a maintainer exercise packaging from a branch without
  # opening a PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `0.0.1-pr.12` on a PR, `0.0.1-dev.34` on dispatch. xtask stamps packages
  # with it; Cargo.toml is left alone so `--locked` still holds.
  PREVIEW_SUFFIX: ${{ github.event.pull_request.number && format('pr.{0}', github.event.pull_request.number) || format('dev.{0}', github.run_number) }}

jobs:
  preview-macos:
    name: Build preview DMG (macOS universal)
    # Run when the just-applied label is build-preview (labeled event), OR when
    # build-preview is already on the PR (synchronize event), OR on dispatch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compute preview version
        id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\).*"/\1/p' Cargo.toml | head -1)
          preview="${base}-${PREVIEW_SUFFIX}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      # No signing secrets here on purpose: previews are ad hoc signed and not
      # notarized.
      - name: Build preview package (ad hoc signed)
        env:
          PWRROUTE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask bundle --universal --require-icon-catalog

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrRoute-${{ steps.version.outputs.version }}-preview-macos
          path: |
            target/bundle/*.dmg
            target/bundle/*.zip
          if-no-files-found: error
          retention-days: 14

  preview-windows:
    name: Build preview Setup.exe and zip (Windows x64)
    # Same gate as the macOS preview above.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compute preview version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\).*"/\1/p' Cargo.toml | head -1)
          preview="${base}-${PREVIEW_SUFFIX}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Build (unsigned)
        run: cargo build --release --locked -p pwrroute-app

      - name: Package zip
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "PwrRoute-$env:PREVIEW_VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/pwrroute.exe, README.md, LICENSE, THIRD_PARTY_LICENSES "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Install .NET for vpk
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install vpk
        shell: bash
        run: scripts/release/install-vpk.sh

      # The script release.yml's windows-sign job runs, minus signing,
      # release notes and deltas.
      - name: Pack unsigned Setup.exe and MSI
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force vpk-input | Out-Null
          Copy-Item target/release/pwrroute.exe, README.md, LICENSE, THIRD_PARTY_LICENSES vpk-input/
          ./scripts/release/vpk-pack-windows.ps1 -Version $env:PREVIEW_VERSION -PackDir vpk-input -OutputDir releases -Icon packaging/windows/PwrRoute.ico
          Get-ChildItem releases | Format-Table Name, Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $portable = [IO.Compression.ZipFile]::OpenRead((Resolve-Path releases/PwrRoute-win-Portable.zip).Path)
          $portable.Entries | Format-Table FullName, Length
          $portable.Dispose()
          Copy-Item releases/PwrRoute-win-Setup.exe, releases/PwrRoute-win.msi dist/ -ErrorAction Stop

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrRoute-${{ steps.version.outputs.version }}-preview-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
          retention-days: 14
