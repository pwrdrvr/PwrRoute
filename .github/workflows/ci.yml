name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Do not add `labeled` here. Dependabot applies labels to dependency PRs,
    # and label-triggered CI creates skipped check suites that can make those
    # PRs appear to have no real status checks. Label-gated builds live in
    # preview-build.yml.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # Supersede older runs for the same PR, while keeping every main commit.
  # Group pushes by SHA: a shared branch group can discard pending commits
  # even with cancel-in-progress disabled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # release.yml's typecheck and test jobs restore this workflow's cache, so
  # they copy these variables (part of rust-cache's key); change both.
  CARGO_TERM_COLOR: always
  # One pin for every job and for the cache key prefix below.
  RUST_TOOLCHAIN: "1.97"
  # No debug info in CI builds: nobody reads it here, and writing it (PDBs
  # on Windows above all) is a large share of compile and link time.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Non-code-only PRs skip those jobs below instead.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      # Only an explicit false from a successful classifier may skip CI.
      code_impacting: ${{ steps.classify.outcome != 'success' || steps.classify.outputs.code_impacting != 'false' }}
    steps:
      - name: Classify changed files
        id: classify
        # A script/runtime failure must select full CI, too.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events always run full CI`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (!Array.isArray(files) || !Number.isSafeInteger(reportedCount) ||
                reportedCount <= 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files?.length} of ${reportedCount})`,
              );
              return;
            }

            // Unknown/malformed entries are not evidence for skipping CI.
            if (files.some((file) => !file || typeof file.filename !== "string" ||
                file.filename.length === 0 ||
                (file.previous_filename !== undefined &&
                 (typeof file.previous_filename !== "string" || file.previous_filename.length === 0)) ||
                (file.status === "renamed" && !file.previous_filename)) ||
                new Set(files.map((file) => file.filename)).size !== reportedCount) {
              fullCi("changed-file list had invalid or duplicate entries");
              return;
            }

            const isNonCodePath = (path) => {
              // Embedded in the app by doc_window.rs, despite its extension.
              if (path === "CHANGELOG.md") return false;
              return path === ".github/dependabot.yml" ||
                path.startsWith("docs/") ||
                // The Claude Design mirror: nothing builds, embeds or tests it.
                path.startsWith("design/") ||
                path.startsWith(".agents/skills/") ||
                path.startsWith(".github/ISSUE_TEMPLATE/") ||
                path.startsWith(".github/PULL_REQUEST_TEMPLATE/") ||
                path.toLowerCase().endsWith(".md");
            };
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isNonCodePath(path));
            });
            const nonCodeOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!nonCodeOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [nonCodeOnly ? "Non-code only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                nonCodeOnly
                  ? "Only documentation, the design mirror, agent skills, PR/issue templates or Dependabot configuration changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` requires it.`,
              )
              .write();

  # The three required checks run on Linux. The `name:` of each is pinned:
  # the "Protect main" ruleset lists `Typecheck`, `Build` and `Test` as
  # required status checks, so renaming one leaves that check permanently
  # pending and blocks every PR. `Typecheck` kept its name from the Electron
  # scaffold; it now runs the whole `cargo xtask lint` chain.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # Before rust-cache: its key hashes every installed toolchain, and the
      # runner image's preinstalled stable changes with each image rollout.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: ./scripts/ci/prune-rust-toolchains.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our toolchain version is in the prefix, so bumping RUST_TOOLCHAIN
          # starts a fresh cache; the prune step above keeps the runner's
          # preinstalled stable out of the key (see the script).
          prefix-key: v1-rust-${{ env.RUST_TOOLCHAIN }}
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # This pin decides the cargo-deny and cargo-about releases (0.20.2 and
      # 0.9.2 at v2.87.29). scripts/sandboxer/verify.sh installs the same
      # ones; move its pins with this one, as cargo-about's output changes
      # between releases.
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-about

      # One aggregate step on purpose: `cargo xtask lint` chains the checks
      # cheapest-first (rustfmt, clippy, cargo-deny, THIRD_PARTY_LICENSES), so
      # a new check is added to xtask and picked up here automatically.
      - name: Lint (rustfmt, clippy, cargo-deny, notices)
        run: cargo xtask lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Before rust-cache: its key hashes every installed toolchain, and the
      # runner image's preinstalled stable changes with each image rollout.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: ./scripts/ci/prune-rust-toolchains.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our toolchain version is in the prefix, so bumping RUST_TOOLCHAIN
          # starts a fresh cache; the prune step above keeps the runner's
          # preinstalled stable out of the key (see the script).
          prefix-key: v1-rust-${{ env.RUST_TOOLCHAIN }}
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (release)
        run: cargo build --release --locked --workspace

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Before rust-cache: its key hashes every installed toolchain, and the
      # runner image's preinstalled stable changes with each image rollout.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: ./scripts/ci/prune-rust-toolchains.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our toolchain version is in the prefix, so bumping RUST_TOOLCHAIN
          # starts a fresh cache; the prune step above keeps the runner's
          # preinstalled stable out of the key (see the script).
          prefix-key: v1-rust-${{ env.RUST_TOOLCHAIN }}
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo xtask test

  macos:
    name: macOS (test + bundle)
    # Apple silicon. gpui-kit compiles Metal shaders at runtime, so no Metal
    # toolchain is needed here. The self-hosted Tart pool e2e-macos uses:
    # GitHub-hosted macOS minutes cost ten times Linux's on a private repo.
    # Never run fork code on this pool, so fork PRs skip this job; it is not
    # a required check.
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false') &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # No prune-rust-toolchains.sh here: the guests persist and are shared
      # with other repositories, so uninstalling their toolchains is not
      # ours to do. Their toolchains change only when someone updates them,
      # so the cache key stays steady without it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our toolchain version is in the prefix, so bumping RUST_TOOLCHAIN
          # starts a fresh cache.
          prefix-key: v1-rust-${{ env.RUST_TOOLCHAIN }}
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo xtask test

      # CI checks the app only; preview/release jobs exercise the full DMG.
      # All packaging uses the lab's stable Xcode 26+ without changing its
      # global selection. A missing icon compiler is a runner prerequisite.
      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./.github/actions/select-xcode-for-actool

      - name: Bundle
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
        run: cargo xtask bundle --app-only --require-icon-catalog

  windows:
    # No license-notice check here: it is CPU-bound (cargo-about matches every
    # crate's license text) and took about 4 minutes on this runner, while the
    # only platform-specific part, line-ending normalization, is unit tested.
    # Typecheck runs it on Linux.
    # No separate build step: the tests compile every module of the app, and
    # a plain `cargo build` drops the test-only gpui-kit feature, which made
    # it recompile the whole GPUI stack a second time. A cold run compiles
    # for about 30 minutes; the limit leaves room for that one run, after
    # which the saved cache makes it a few minutes. release.yml builds the
    # Windows release exe.
    name: Windows (test)
    runs-on: windows-2025
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    timeout-minutes: 60
    steps:
      # .gitattributes forces LF; this keeps Git for Windows from fighting it.
      - run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Before rust-cache: its key hashes every installed toolchain, and the
      # runner image's preinstalled stable changes with each image rollout.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: ./scripts/ci/prune-rust-toolchains.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our toolchain version is in the prefix, so bumping RUST_TOOLCHAIN
          # starts a fresh cache; the prune step above keeps the runner's
          # preinstalled stable out of the key (see the script).
          prefix-key: v1-rust-${{ env.RUST_TOOLCHAIN }}
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo xtask test


  # Desktop E2E: `cargo xtask e2e` builds the app and drives it through its
  # env-gated test hook (e2e/AGENTS.md). One job per OS; the `Desktop E2E`
  # aggregate below is the one check to require, not these.
  e2e-linux:
    name: Linux Desktop E2E
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    timeout-minutes: 40
    env:
      # A hosted runner is thrown away after the job (e2e/CONTRACT.md).
      PWRROUTE_E2E_DISPOSABLE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      # Xvfb for the display, Mesa's lavapipe for software Vulkan (wgpu has
      # no GPU here), xwininfo/xprop/import for the OS-side checks, and
      # xdg-utils for the scenarios that make PwrRoute the default browser.
      - name: Install the headless desktop
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers x11-utils imagemagick xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Saved even when a test fails: the build is what is slow to redo.
          cache-on-failure: true

      - name: Desktop E2E
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" cargo xtask e2e

      - name: Upload Desktop E2E artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-desktop-e2e-artifacts
          path: target/e2e-artifacts/
          retention-days: 30

  e2e-macos:
    name: macOS Desktop E2E
    # The restricted Tart runner pool PwrGit and PwrAgnt use. PwrRoute must be
    # in that organization runner group's selected repositories, or this job
    # stays queued. Never run fork code on this pool. The guests persist
    # between jobs, so they are not disposable: no PWRROUTE_E2E_DISPOSABLE.
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false') &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Saved even when a test fails: the build is what is slow to redo.
          cache-on-failure: true

      - name: Clear PwrRoute state left by earlier jobs
        timeout-minutes: 5
        run: ./scripts/ci/macos-e2e-pre-run-cleanup.sh

      # GPUI draws nothing for a window the platform does not present. Wake
      # the display, and hold it awake for the run (power assertions, no
      # settings); then require an unlocked desktop, since behind the lock
      # screen no window is presented.
      - name: Wake the display
        run: caffeinate -u -t 2

      - name: Require an unlocked desktop
        timeout-minutes: 2
        run: ./scripts/ci/macos-e2e-require-desktop.sh

      - name: Desktop E2E
        timeout-minutes: 30
        run: caffeinate -dims cargo xtask e2e

      - name: Upload Desktop E2E artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-desktop-e2e-artifacts
          path: target/e2e-artifacts/
          retention-days: 30

  e2e-windows:
    name: Windows Desktop E2E
    # The hosted image has an interactive desktop session, so the app can
    # open its window. A cold build of the GPUI stack takes about 30 minutes
    # (see the windows job); the cache makes later runs a few.
    runs-on: windows-2025
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    timeout-minutes: 60
    env:
      PWRROUTE_E2E_DISPOSABLE: "1"
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. The store is capped at 10 GB and each
          # PR branch would save 2-3 GB across the three platforms, evicting
          # main's entries; a PR then finds nothing to restore and Windows
          # compiles cold for 35+ minutes. PRs restore main's cache instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Saved even when a test fails: the build is what is slow to redo.
          cache-on-failure: true

      - name: Desktop E2E
        run: cargo xtask e2e

      - name: Upload Desktop E2E artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-e2e-artifacts
          path: target/e2e-artifacts/
          retention-days: 30

  desktop-e2e-result:
    # The check to require. `always()` so a failed platform job reaches this
    # one: a skipped required check counts as satisfied, and without it the
    # gate would stop gating in exactly the case it exists for.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, e2e-linux, e2e-macos, e2e-windows]
    # Also when Classify Changes itself failed: its output is then empty, and
    # skipping here would turn a broken classifier into a passing gate.
    if: >-
      always() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.code_impacting != 'false')
    timeout-minutes: 5
    steps:
      - name: Require Linux, eligible macOS and Windows Desktop E2E
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINUX_E2E_RESULT: ${{ needs.e2e-linux.result }}
          MACOS_E2E_RESULT: ${{ needs.e2e-macos.result }}
          WINDOWS_E2E_RESULT: ${{ needs.e2e-windows.result }}
          # macOS is not scheduled for fork PRs (the self-hosted guests must
          # not run untrusted code), so it reports `skipped` there. Excuse
          # exactly that case; any other missing macOS result fails, so an
          # event neither job anticipated fails closed.
          MACOS_IS_FORK_PR: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          say() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # Report every platform before failing, so a red gate names each
          # one that broke.
          status=0
          require() {
            if [[ "$2" == "success" ]]; then
              say "- PASS \`$1\` ($2)"
            else
              say "- FAIL \`$1\` ($2)"
              echo "::error::$1 Desktop E2E did not succeed ($2)."
              status=1
            fi
          }

          say "### Desktop E2E platform results"
          require "Classify Changes" "$CHANGES_RESULT"
          require "Linux" "$LINUX_E2E_RESULT"
          if [[ "$MACOS_IS_FORK_PR" == "true" && "$MACOS_E2E_RESULT" == "skipped" ]]; then
            say "- SKIP \`macOS\` (skipped): fork PR; the self-hosted lane is not scheduled"
            echo "::warning::macOS Desktop E2E did not run for this fork PR; macOS coverage is unverified."
          else
            require "macOS" "$MACOS_E2E_RESULT"
          fi
          require "Windows" "$WINDOWS_E2E_RESULT"

          exit "$status"
