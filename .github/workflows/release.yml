name: Release (macOS + Windows + Linux)

# A `vX.Y.Z` tag builds every platform, then publishes one GitHub Pre-release
# with all of them. Each signed platform is two jobs, as in PwrGit: an
# unprivileged prepare job builds from source and hands a signing-input
# archive and its SHA-256 to a credentialed sign job, which never checks out
# source. The sign job packs the release with Velopack's `vpk` (installers
# and the update feed). Signing runs only when its credentials are present,
# and an unsigned lane says so in a warning. See README.md beside this file.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # pre-release tags like v0.0.1-alpha.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.0.1-alpha.1). Must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: none

env:
  CARGO_TERM_COLOR: always

jobs:
  # Stub. PwrGit's equivalent compares Winget and Homebrew with the release
  # before and after publication; PwrRoute has neither package yet.
  distribution-audit:
    name: Inspect Winget and Homebrew before release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Not configured yet
        run: echo "::notice::No Winget or Homebrew package exists yet; nothing to audit. See .github/workflows/README.md."

  prepare:
    name: Check release metadata, lint and test
    needs: distribution-audit
    runs-on: ubuntu-24.04
    # A tag ref starts with a cold Rust cache: lint and test compile the
    # workspace twice from scratch, which took 30 minutes for v0.1.0-rc.1.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny,cargo-about

      # Through the environment, never spliced into the script: a tag typed
      # into the dispatch form is text, not shell.
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: cargo xtask release-check

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

  macos-prepare:
    name: Build macOS universal and prepare signing input
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Ad hoc signed; vpk re-signs it in the sign job.
      - name: Build PwrRoute.app (universal)
        run: cargo xtask bundle --universal --app-only

      # Everything the sign job needs, and nothing else: it has no checkout.
      - name: Stage signing input
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/macos-release-input"
          mkdir -p "$stage"
          ditto target/bundle/PwrRoute.app "$stage/PwrRoute.app"
          cp packaging/macos/PwrRoute.entitlements packaging/macos/PwrRoute.icns \
            scripts/release/macos-dmg.sh scripts/release/install-vpk.sh "$stage/"
          cargo xtask release-check --notes-file "$stage/RELEASE_NOTES.md"

      - name: Archive signing input
        id: archive
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/macos-release-signing-input.tgz"
          tar -czf "$tarball" -C "$RUNNER_TEMP/macos-release-input" .
          sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf "%s  macos-release-signing-input.tgz\n" "$sha256" > "$tarball.sha256"

      - name: Upload signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-signing-input
          path: |
            ${{ runner.temp }}/macos-release-signing-input.tgz
            ${{ runner.temp }}/macos-release-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  macos-sign:
    name: Pack, sign and notarize macOS (when configured)
    # The only macOS job with Apple credentials. It does not check out source
    # or run cargo; it packs the verified app from macos-prepare.
    needs: macos-prepare
    runs-on: macos-26
    timeout-minutes: 90
    environment: apple-signing
    steps:
      - name: Download signing input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-signing-input
          path: .release-input

      - name: Verify signing input
        env:
          EXPECTED_SHA256: ${{ needs.macos-prepare.outputs.signing-input-sha256 }}
        run: |
          set -euo pipefail
          cd .release-input
          actual="$(shasum -a 256 macos-release-signing-input.tgz | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::signing input SHA-256 mismatch: expected $EXPECTED_SHA256, got $actual" >&2
            exit 1
          fi
          shasum -a 256 --check macos-release-signing-input.tgz.sha256

      - name: Expand signing input
        run: mkdir input && tar -xzf .release-input/macos-release-signing-input.tgz -C input

      - name: Install .NET for vpk
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # From the signing input: pinned version, SHA-512-verified package.
      - name: Install vpk
        run: input/install-vpk.sh

      # Secrets cannot appear in `if:` expressions, so read them into env and
      # publish one boolean for the steps below.
      - name: Detect Apple signing credentials
        id: creds
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not configured; packing an ad hoc signed, unnotarized macOS build."
          fi

      # A keychain of its own for the Developer ID certificate and the
      # notarytool profile vpk and macos-dmg.sh use, gone with the runner.
      - name: Import Developer ID certificate and notary profile
        id: keychain
        if: steps.creds.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: T44CNHC4UH
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # Word splitting is the point: each existing keychain stays listed.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n "s/.*\"\(Developer ID Application: .*($APPLE_TEAM_ID)\)\"/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the imported certificate."
            exit 1
          fi

          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials pwrroute-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --keychain "$keychain"
          rm "$RUNNER_TEMP/AuthKey.p8"

          {
            echo "path=$keychain"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

      # The newest published full package, so vpk can write a delta against
      # it. The first release, or a feed that cannot be read, packs full only.
      - name: Fetch the previous release for deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! vpk --skip-updates download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" --pre --channel osx --outputDir releases; then
            echo "::warning::Could not fetch the previous macOS release; packing without a delta."
          fi

      # vpk adds UpdateMac and sq.version to the app and re-signs it with our
      # entitlements (none). Signed: Developer ID, hardened runtime,
      # notarized and stapled by vpk. Unsigned: ad hoc (`-`), because an app
      # vpk changed but did not sign fails `codesign --verify`. No .pkg
      # installer (--noInst): it needs a Developer ID Installer certificate,
      # which apple-signing does not hold; the DMG is the installer.
      - name: Pack with vpk
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGNED: ${{ steps.creds.outputs.signed }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          set -euo pipefail
          args=(
            pack
            --packId PwrRoute
            --packVersion "${RELEASE_TAG#v}"
            --packDir input/PwrRoute.app
            --mainExe pwrroute
            --packTitle PwrRoute
            --packAuthors "PwrDrvr LLC"
            --releaseNotes input/RELEASE_NOTES.md
            --signEntitlements input/PwrRoute.entitlements
            --icon input/PwrRoute.icns
            --noInst
            --outputDir releases
          )
          if [ "$SIGNED" = "true" ]; then
            args+=(--signAppIdentity "$IDENTITY" --notaryProfile pwrroute-notary --keychain "$KEYCHAIN")
          else
            args+=(--signAppIdentity -)
          fi
          vpk --skip-updates "${args[@]}"

      - name: Put the packed app in a DMG
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
          NOTARY_PROFILE: pwrroute-notary
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/packed"
          ditto -x -k releases/PwrRoute-osx-Portable.zip "$RUNNER_TEMP/packed"
          input/macos-dmg.sh "$RUNNER_TEMP/packed/PwrRoute.app" \
            "dist/PwrRoute-${RELEASE_TAG#v}-universal.dmg" "$IDENTITY"

      - name: Verify macOS signature and notarization
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: T44CNHC4UH
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/packed/PwrRoute.app"
          codesign --verify --deep --strict --all-architectures "$app"
          details=$(codesign -dv "$app" 2>&1)
          if ! grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details"; then
            echo "::error::PwrRoute.app is not signed by team $APPLE_TEAM_ID." >&2
            exit 1
          fi
          test -x "$app/Contents/MacOS/UpdateMac"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          dmg=$(ls dist/*.dmg)
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Verify ad hoc signature
        if: steps.creds.outputs.signed != 'true'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/packed/PwrRoute.app"
          codesign --verify --deep --strict --all-architectures "$app"
          test -x "$app/Contents/MacOS/UpdateMac"

      # This version's packages and the osx feed only: the previous release's
      # package fetched for the delta stays in the release that owns it.
      - name: Collect macOS release assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cp "releases/PwrRoute-$version-osx-full.nupkg" releases/PwrRoute-osx-Portable.zip \
            releases/releases.osx.json releases/assets.osx.json releases/RELEASES-osx dist/
          if [ -f "releases/PwrRoute-$version-osx-delta.nupkg" ]; then
            cp "releases/PwrRoute-$version-osx-delta.nupkg" dist/
          fi
          (cd dist && shasum -a 256 -- * > "PwrRoute-$version-macos-SHA256SUMS")
          ls -l dist

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  windows-prepare:
    name: Build Windows x64 and prepare signing input
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      # The C runtime linked in, so pwrroute.exe runs where the Visual C++
      # runtime was never installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked -p pwrroute-app

      # `app/` becomes vpk's packDir: what installs under
      # %LocalAppData%\PwrRoute\current.
      - name: Stage signing input
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "windows-release-input"
          New-Item -ItemType Directory -Force "$stage/app" | Out-Null
          Copy-Item target/release/pwrroute.exe, README.md, LICENSE, THIRD_PARTY_LICENSES "$stage/app/"
          Copy-Item scripts/release/install-vpk.sh, scripts/release/vpk-pack-windows.ps1, packaging/windows/PwrRoute.ico "$stage/"
          cargo xtask release-check --notes-file "$stage/RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "release-check failed (exit code $LASTEXITCODE)." }

      - name: Archive signing input
        id: archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-release-signing-input.tgz"
          & tar.exe -czf $archive -C (Join-Path $env:RUNNER_TEMP "windows-release-input") .
          if ($LASTEXITCODE -ne 0) { throw "Failed to archive Windows signing input (exit code $LASTEXITCODE)." }
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$sha256  windows-release-signing-input.tgz" | Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-signing-input
          path: |
            ${{ runner.temp }}/windows-release-signing-input.tgz
            ${{ runner.temp }}/windows-release-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Pack and sign Windows installer (when configured)
    # The only Windows job with Azure credentials. It does not check out
    # source or run cargo; it packs the verified build from windows-prepare.
    needs: windows-prepare
    runs-on: windows-2025
    timeout-minutes: 45
    environment: windows-signing
    steps:
      - name: Download signing input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-signing-input
          path: .release-input

      - name: Verify signing input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-prepare.outputs.signing-input-sha256 }}
        run: |
          $archive = ".release-input/windows-release-signing-input.tgz"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Windows signing input digest mismatch: expected $env:EXPECTED_SHA256, got $actual."
          }
          $recorded = (Get-Content "$archive.sha256" -Raw).Trim()
          if ($recorded -ne "$actual  windows-release-signing-input.tgz") {
            throw "Windows signing input checksum file does not match the downloaded archive."
          }

      - name: Expand signing input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input | Out-Null
          & tar.exe -xzf .release-input/windows-release-signing-input.tgz -C input
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand Windows signing input (exit code $LASTEXITCODE)." }

      # vpk runs on .NET; so does the Azure Artifact Signing dlib it ships.
      - name: Install .NET for vpk
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # From the signing input: pinned version, SHA-512-verified package.
      - name: Install vpk
        shell: bash
        run: input/install-vpk.sh

      - name: Detect Azure signing configuration
        id: creds
        shell: bash
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$WIN_AZURE_SIGN_PUBLISHER_NAME" ] && [ -n "$WIN_AZURE_SIGN_ENDPOINT" ] && [ -n "$WIN_AZURE_SIGN_ACCOUNT" ] && [ -n "$WIN_AZURE_SIGN_PROFILE" ] \
            && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure signing is not configured; packing an unsigned Windows build."
          fi

      # The metadata.json the Azure Artifact Signing dlib reads; the
      # credentials come from the AZURE_* environment of the pack step.
      - name: Write Azure Artifact Signing metadata
        if: steps.creds.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
        run: |
          @{
            Endpoint = $env:WIN_AZURE_SIGN_ENDPOINT
            CodeSigningAccountName = $env:WIN_AZURE_SIGN_ACCOUNT
            CertificateProfileName = $env:WIN_AZURE_SIGN_PROFILE
          } | ConvertTo-Json | Set-Content -Path (Join-Path $env:RUNNER_TEMP "azure-signing.json") -Encoding utf8

      # The newest published full package, so vpk can write a delta against
      # it. The first release, or a feed that cannot be read, packs full only.
      - name: Fetch the previous release for deltas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! vpk --skip-updates download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" --pre --channel win --outputDir releases; then
            echo "::warning::Could not fetch the previous Windows release; packing without a delta."
          fi

      # The flags, and why, are in vpk-pack-windows.ps1, shared with
      # preview-build.yml.
      - name: Pack with vpk
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGNED: ${{ steps.creds.outputs.signed }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $pack = @{
            Version = $env:RELEASE_TAG.TrimStart("v")
            PackDir = "input/app"
            OutputDir = "releases"
            Icon = "input/PwrRoute.ico"
            ReleaseNotes = "input/RELEASE_NOTES.md"
          }
          if ($env:SIGNED -eq "true") {
            $pack.AzureSignFile = Join-Path $env:RUNNER_TEMP "azure-signing.json"
          }
          ./input/vpk-pack-windows.ps1 @pack

      - name: Verify Authenticode signatures
        if: steps.creds.outputs.signed == 'true'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive releases/PwrRoute-win-Portable.zip -DestinationPath $portable
          $targets = @(
            "releases/PwrRoute-win-Setup.exe",
            "releases/PwrRoute-win.msi",
            (Join-Path $portable "Update.exe"),
            (Join-Path $portable "PwrRoute.exe"),
            (Join-Path $portable "current/pwrroute.exe")
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) {
              throw "Expected signed file is missing: $target"
            }
            $signature = Get-AuthenticodeSignature (Resolve-Path $target).Path
            if ($signature.Status -ne "Valid") {
              throw "Authenticode signature is not valid for ${target}: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
              throw "Unexpected Authenticode signer for ${target}: $($signature.SignerCertificate.Subject)"
            }
            "signed: $target"
          }

      # This version's packages and the win feed only: the previous release's
      # package fetched for the delta stays in the release that owns it.
      - name: Collect Windows release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          # Exact names: a prefix glob would also catch the previous
          # prerelease's package (PwrRoute-0.0.1-alpha.3-full.nupkg for 0.0.1).
          $delta = "PwrRoute-$version-delta.nupkg"
          if (Test-Path -LiteralPath (Join-Path releases $delta)) {
            Copy-Item -LiteralPath (Join-Path releases $delta) -Destination dist
          }
          foreach ($name in @(
            "PwrRoute-$version-full.nupkg",
            "PwrRoute-win-Setup.exe", "PwrRoute-win.msi", "PwrRoute-win-Portable.zip",
            "releases.win.json", "assets.win.json", "RELEASES"
          )) {
            Copy-Item -LiteralPath (Join-Path releases $name) -Destination dist -ErrorAction Stop
          }
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllText("dist/PwrRoute-$version-windows-SHA256SUMS", ($sums -join "`n") + "`n")
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # Velopack is not used on Linux yet: vpk's Linux output is an AppImage
  # only, and its updater runs only from one. The .deb and tar.gz stay as
  # they are; see README.md beside this file.
  linux:
    name: Package Linux (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners: their glibc is the floor the binary
          # needs, so building there runs on the most systems.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Linux packages are not signed, matching PwrGit.
      - name: Package DEB and tar.gz
        run: cargo xtask package-linux

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            target/package/*.deb
            target/package/*.tar.gz
            target/package/*-SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Create release and publish platform assets
    runs-on: ubuntu-24.04
    needs: [macos-sign, windows-sign, linux]
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      # One directory per artifact: merging would let a same-named file from
      # one platform silently replace another's.
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts

      - name: Check asset names are unique
        run: |
          set -euo pipefail
          dupes=$(find release-artifacts -type f -exec basename {} \; | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two platforms produced the same asset name: $dupes" >&2
            exit 1
          fi
          mkdir release-assets
          find release-artifacts -type f -exec mv {} release-assets/ \;

      # Every CI-published build is born as a GitHub Pre-release; promote to
      # Latest manually after validation.
      - name: Create pre-release with changelog notes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          cargo xtask release-check --notes-file "$notes"
          ls -l release-assets
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "PwrRoute $RELEASE_TAG" \
            --notes-file "$notes" \
            release-assets/*

  # Stub, like distribution-audit above.
  distribution-audit-after:
    name: Inspect Winget and Homebrew after publication
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Not configured yet
        run: echo "::notice::No Winget or Homebrew package exists yet; nothing to audit. See .github/workflows/README.md."
