name: Release (macOS + Windows + Linux)

# A `vX.Y.Z` tag builds every platform, then publishes one GitHub Pre-release
# with all of them. Signing steps run only when their credentials are present,
# and an unsigned lane says so in a warning, so adding the secrets is all it
# takes to light them up. See README.md beside this file.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # pre-release tags like v0.0.1-alpha.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.0.1-alpha.1). Must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: none

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check release metadata, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny,cargo-about

      # Through the environment, never spliced into the script: a tag typed
      # into the dispatch form is text, not shell.
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: cargo xtask release-check

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

  macos:
    name: Package macOS universal (sign and notarize when configured)
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Secrets cannot appear in `if:` expressions, so read them into env and
      # publish one boolean for the steps below.
      - name: Detect Apple signing credentials
        id: creds
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # A keychain of its own for the Developer ID certificate, gone with the
      # runner.
      - name: Import Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # Word splitting is the point: each existing keychain stays listed.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign, notarize, package macOS
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: T44CNHC4UH
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning | sed -n "s/.*\"\(Developer ID Application: .*($APPLE_TEAM_ID)\)\"/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the imported certificate."
            exit 1
          fi
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          cargo xtask bundle --universal --sign "$identity" --notarize

      - name: Verify macOS signature and notarization
        if: steps.creds.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --all-architectures target/bundle/PwrRoute.app
          xcrun stapler validate target/bundle/PwrRoute.app
          spctl --assess --type execute -vv target/bundle/PwrRoute.app

      - name: Package macOS (ad hoc signed, not notarized)
        if: steps.creds.outputs.signed != 'true'
        run: |
          echo "::warning::Apple signing secrets are not configured; packaging an ad hoc signed, unnotarized macOS build."
          cargo xtask bundle --universal

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            target/bundle/*.dmg
            target/bundle/*.zip
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Package Windows x64 (sign when configured)
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    environment: windows-signing
    env:
      # The C runtime linked in, so pwrroute.exe runs where the Visual C++
      # runtime was never installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked -p pwrroute-app

      - name: Detect Azure signing configuration
        id: creds
        shell: bash
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$WIN_AZURE_SIGN_PUBLISHER_NAME" ] && [ -n "$WIN_AZURE_SIGN_ENDPOINT" ] && [ -n "$WIN_AZURE_SIGN_ACCOUNT" ] && [ -n "$WIN_AZURE_SIGN_PROFILE" ] \
            && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TrustedSigning
        if: steps.creds.outputs.signed == 'true'
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/release/install-trusted-signing.ps1

      # Azure Artifact Signing reads the service principal from AZURE_*.
      - name: Sign pwrroute.exe
        if: steps.creds.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Invoke-TrustedSigning `
            -Endpoint $env:WIN_AZURE_SIGN_ENDPOINT `
            -CodeSigningAccountName $env:WIN_AZURE_SIGN_ACCOUNT `
            -CertificateProfileName $env:WIN_AZURE_SIGN_PROFILE `
            -Files (Resolve-Path target/release/pwrroute.exe).Path `
            -FileDigest SHA256 `
            -TimestampRfc3161 http://timestamp.acs.microsoft.com `
            -TimestampDigest SHA256

      - name: Verify Authenticode signature
        if: steps.creds.outputs.signed == 'true'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          $exe = (Resolve-Path target/release/pwrroute.exe).Path
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne "Valid") {
            throw "Authenticode signature is not valid for ${exe}: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
            throw "Unexpected Authenticode signer for ${exe}: $($signature.SignerCertificate.Subject)"
          }

      - name: Note an unsigned build
        if: steps.creds.outputs.signed != 'true'
        shell: bash
        run: echo "::warning::Azure signing is not configured; packaging an unsigned Windows build."

      - name: Package zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $name = "PwrRoute-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/pwrroute.exe, README.md, LICENSE, THIRD_PARTY_LICENSES "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Package Linux (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners: their glibc is the floor the binary
          # needs, so building there runs on the most systems.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install GPUI system libraries
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Linux packages are not signed, matching PwrGit.
      - name: Package DEB and tar.gz
        run: cargo xtask package-linux

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            target/package/*.deb
            target/package/*.tar.gz
            target/package/*-SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Create release and publish platform assets
    runs-on: ubuntu-24.04
    needs: [macos, windows, linux]
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.97"

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      # Every CI-published build is born as a GitHub Pre-release; promote to
      # Latest manually after validation.
      - name: Create pre-release with changelog notes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          cargo xtask release-check --notes-file "$notes"
          ls -l release-assets
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "PwrRoute $RELEASE_TAG" \
            --notes-file "$notes" \
            release-assets/*
