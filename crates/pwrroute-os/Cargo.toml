[package]
name = "pwrroute-os"
description = "PwrRoute's OS edge: link receipt and default-browser registration on macOS, Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pwrroute-router = { workspace = true }
anyhow = { workspace = true }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The main queue, for NSApplication's yieldActivation from the dispatch
# thread. Already shipped (GPUI's macOS platform uses it).
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    # systemUptime, the clock in Edge's singleton message.
    "NSProcessInfo",
    "NSString",
    "NSURL",
    # AEKeyword, for reading the sender's pid off the Apple Event.
    "objc2-core-services",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    # yieldActivation, so a browser may bring its own window forward.
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    # URLForApplicationWithBundleIdentifier, for a handler's display name,
    # and iconForFile:, for an app's icon.
    "NSWorkspace",
    "NSAccessibility",
    # Path-specific default-browser requests (distinguishes worktree bundles).
    "block2",
    # Rendering that icon to a PNG.
    "NSBitmapImageRep",
    "NSColorSpace",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
    "CFURL",
    # The window server's window list (window_order).
    "CFArray",
    "CFDictionary",
    "CFNumber",
] }
# CGWindowListCopyWindowInfo, for which app's window is on top.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGWindow",
] }
objc2-core-services = { version = "0.3", default-features = false, features = [
    "std",
    "LaunchServices",
    "LSInfo",
] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"


[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"]
