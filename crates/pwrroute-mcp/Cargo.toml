[package]
name = "pwrroute-mcp"
description = "PwrRoute's local-agent door: MCP served by the app over a per-user socket or pipe, reached through `pwrroute mcp`, with an in-app approval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pwrroute-browsers = { workspace = true }
pwrroute-engine = { workspace = true }
pwrroute-os = { workspace = true }
pwrroute-router = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "3.5.1", default-features = false, features = ["server"] }
tokio = { version = "1", features = [
    "rt",
    "net",
    "io-util",
    "io-std",
    "macros",
    "sync",
    "time",
] }
tokio-util = "0.7"
schemars = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
