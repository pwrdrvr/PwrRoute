[package]
name = "pwrroute-router"
description = "PwrRoute's resident router: dispatch, the recent-dispatch buffer, single instance and IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `http`: HttpNetwork, which expands short links on the dispatch thread.
pwrroute-engine = { workspace = true, features = ["http"] }
anyhow = { workspace = true }
# The diagnostic log line per dispatch; the app installs the logger.
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# Unix domain sockets and Windows named pipes behind one safe API.
interprocess = "2.4"
url = "2.5"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW, so the journal never appends through a symlink.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
