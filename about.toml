# cargo-about: writes THIRD_PARTY_LICENSES (see `cargo xtask licenses`).
# Keep `accepted` in step with deny.toml's allow list; deny.toml is the gate,
# this file only transcribes.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Per-crate exceptions, mirroring deny.toml's [[licenses.exceptions]].
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]
