# cargo-deny: licenses, advisories, bans and sources for everything we ship.
# `cargo xtask lint` runs `cargo deny check`, so CI fails on any of these.

[graph]
# The platforms releases are built for. Dependencies that only exist for other
# targets never ship, so they are not judged.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false

[licenses]
# Adding an id here is a deliberate legal decision. Make it explicitly, in a
# commit that says why; never add one to make CI green. The Pwr family's
# shared list comes first; ids the Rust port needed follow, each with its
# reason.
allow = [
    # The Pwr family allowlist (PwrGit, reconciled there).
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Python-2.0",
    "Unlicense",

    # Added with the Rust port (2026-10-13). Each is permissive; each is still
    # a legal decision recorded here for review.
    # Unicode License v3: the ICU4X crates (via oxc's diagnostics and url's
    # IDNA) and unicode-ident, which every proc-macro build pulls in.
    "Unicode-3.0",
    # zlib License: foldhash (hashbrown, serde_json) and slotmap (GPUI).
    "Zlib",
]
confidence-threshold = 0.9
# The family list is shared across apps; ids no crate uses today are fine.
unused-allowed-license = "allow"

# Licenses allowed for one crate only, rather than tree-wide.
[[licenses.exceptions]]
# Boost Software License 1.0 (not the Business Source License). The crate is
# dual-licensed with Apache-2.0 WITH LLVM-exception; either is permissive.
crate = "dragonbox_ecma"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
# The bzip2 license, BSD-like, for the Rust port of libbzip2.
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[advisories]
# RustSec. A yanked crate or an unmaintained notice is a warning to act on in
# its own change, not a reason to block every PR.
yanked = "warn"
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
